name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        # Quote the eval script. An unquoted parenthesis is a shell error, so mongosh never runs.
        options: >-
          --health-cmd "mongosh --quiet --host 127.0.0.1 --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/taskflow_test
      REDIS_URL: redis://127.0.0.1:6379/1
      BULL_PREFIX: taskflow_test
      JWT_ACCESS_SECRET: ci-access-secret-value
      JWT_REFRESH_SECRET: ci-refresh-secret-value
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
