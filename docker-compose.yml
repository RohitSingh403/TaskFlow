services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - taskflow-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - taskflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/taskflow
      REDIS_URL: redis://redis:6379
      BULL_PREFIX: taskflow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/taskflow
      REDIS_URL: redis://redis:6379
      BULL_PREFIX: taskflow
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/taskflow
      REDIS_URL: redis://redis:6379
      BULL_PREFIX: taskflow
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_PROXY: http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  taskflow-mongo:
  taskflow-redis:
